<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control room · Kaaka</title>
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#012624">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<style>
:root { color-scheme: dark; --abyss: #012624; --deep: #011d1c; --kelp: #003734; --mist: #edfffe; --silver: #bbc7c6; --slate: #707777; --phosphor: #fde9ff; --hairline: rgba(255, 255, 255, .12);
  --aurora: linear-gradient(90deg, rgb(203, 255, 252) 0%, rgb(237, 255, 254) 26.25%, rgb(255, 253, 250) 47.57%, rgb(250, 209, 255) 88.96%); }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--abyss); }
body { color: var(--silver); font: 400 16px/1.5 "Inter", ui-sans-serif, system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; padding: 24px max(16px, env(safe-area-inset-left)); }
.card { width: 100%; max-width: 400px; background: var(--deep); border: 1px solid var(--hairline); border-radius: 16px; padding: 36px 32px; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font-weight: 500; font-size: 20px; letter-spacing: -0.02em; }
.label { margin: 28px 0 8px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--mist); }
h1 { margin: 0 0 6px; color: #fff; font-weight: 500; font-size: 32px; letter-spacing: -0.03em; line-height: 1.1; }
p { margin: 0 0 18px; }
form { display: grid; gap: 12px; margin-top: 20px; }
input { width: 100%; background: var(--abyss); border: 1px solid var(--hairline); border-radius: 8px; color: #fff; font: 500 22px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .3em; text-align: center; padding: 14px; }
input:focus { outline: 2px solid var(--mist); outline-offset: 2px; }
button { border: 0; border-radius: 6px; padding: 14px 18px; font: 500 14px/1 "Inter", system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.go { background: var(--aurora); color: #222; }
.demo { margin-top: 22px; padding: 14px 16px; border-radius: 10px; background: rgba(0, 55, 52, .6); border: 1px solid rgba(253, 233, 255, .25); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.demo span { font-size: 13px; } .demo b { color: var(--phosphor); font: 500 18px/1 ui-monospace, Menlo, monospace; letter-spacing: .2em; }
.demo button { background: var(--kelp); color: #fff; padding: 10px 12px; font-size: 12px; }
.err { color: #ffb8a6; font-size: 14px; margin: 14px 0 0; }
.note { margin-top: 18px; font-size: 13px; color: var(--slate); }
.note a { color: var(--silver); }
</style>
</head>
<body>
<main class="card">
  <a class="brand" href="/" aria-label="Kaaka home">
    <svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="none" stroke="#ffffff" stroke-width="1.5"/><circle cx="14" cy="14" r="5" fill="#fde9ff"/><path d="M19 14h7" stroke="#ffffff" stroke-width="1.5"/></svg>
    kaaka
  </a>
  <p class="label">Control room</p>
  <h1>Enter the PIN</h1>
  <p>The control room shows live incidents, callers' locations and responders.</p>
  {{ERROR}}
  <form method="post" action="/admin/login">
    <label for="pin" class="label" style="margin:0">PIN or admin token</label>
    <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required autofocus>
    <button class="go" type="submit">Open control room</button>
  </form>
  {{DEMO}}
  <p class="note"><a href="/">← Back to the Kaaka site</a> · <a href="/docs/">Docs</a></p>
</main>
<script>
const fill = document.getElementById('use-demo');
if (fill) fill.addEventListener('click', () => { const i = document.getElementById('pin'); i.value = fill.dataset.pin; i.form.requestSubmit(); });
</script>
</body>
</html>
